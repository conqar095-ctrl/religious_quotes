name: Auto Religious Video

on:
  workflow_dispatch:
  schedule:
    # GitHub Actions cron uses UTC.
    - cron: '0 9 * * *'

permissions:
  contents: write

concurrency:
  group: religious-quotes-pipeline
  cancel-in-progress: false

jobs:
  build-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
      YOUTUBE_PRIVACY: public
      CAPTION_FONT: /usr/share/fonts/truetype/noto/NotoSansArabic-Regular.ttf

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg imagemagick fonts-noto-core fonts-noto-extra fontconfig
          fc-match 'Noto Sans Arabic'
          test -f "$CAPTION_FONT"

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Run pipeline
        run: python religious_quotes.py

      - name: Save used-script state
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/used_voiceover_scripts.txt
          if git diff --cached --quiet; then
            echo 'No state change to commit.'
          else
            git commit -m 'chore: update used voiceover state'
            git push
          fi
