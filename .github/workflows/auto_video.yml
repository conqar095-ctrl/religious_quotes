name: Auto Religious Video

on:
  workflow_dispatch:

  schedule:
    # 09:00 Egypt time
    - cron: "0 9 * * *"
      timezone: "Africa/Cairo"

    # 15:00 Egypt time
    - cron: "0 15 * * *"
      timezone: "Africa/Cairo"

    # 21:00 Egypt time
    - cron: "0 21 * * *"
      timezone: "Africa/Cairo"

permissions:
  contents: write

concurrency:
  group: religious-quotes-pipeline
  cancel-in-progress: false

jobs:
  build-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      # =========================
      # Secrets
      # =========================
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}

      # =========================
      # Runtime configuration
      # =========================
      YOUTUBE_PRIVACY: public

      # Arabic caption font
      CAPTION_FONT: /usr/share/fonts/truetype/noto/NotoSansArabic-Regular.ttf

    steps:

      # ============================================================
      # 1) Checkout repository
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ============================================================
      # 2) Python
      # ============================================================
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # ============================================================
      # 3) Install system tools
      # ============================================================
      - name: Install system dependencies
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "Installing system dependencies"
          echo "========================================"

          sudo apt-get update

          sudo apt-get install -y \
            ffmpeg \
            imagemagick \
            fonts-noto-core \
            fonts-noto-extra \
            fontconfig

          echo
          echo "========================================"
          echo "Checking FFmpeg"
          echo "========================================"

          command -v ffmpeg
          ffmpeg -version | head -n 1

          echo
          echo "========================================"
          echo "Checking FFprobe"
          echo "========================================"

          command -v ffprobe
          ffprobe -version | head -n 1

          echo
          echo "========================================"
          echo "Checking ImageMagick"
          echo "========================================"

          if command -v magick >/dev/null 2>&1; then
            echo "Found: magick"
            command -v magick
            magick -version | head -n 1

          elif command -v convert >/dev/null 2>&1; then
            echo "Found: convert"
            command -v convert

            sudo ln -sf "$(command -v convert)" /usr/local/bin/magick

            echo "Created magick compatibility command:"
            command -v magick
            magick -version | head -n 1

          else
            echo "ERROR: ImageMagick was not found."
            exit 1
          fi

          echo
          echo "========================================"
          echo "Checking Arabic font"
          echo "========================================"

          fc-match "Noto Sans Arabic"

          test -f "$CAPTION_FONT"

          echo
          echo "========================================"
          echo "SYSTEM DEPENDENCIES OK"
          echo "========================================"

      # ============================================================
      # 4) Python packages
      # ============================================================
      - name: Install Python dependencies
        shell: bash
        run: |
          set -e

          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      # ============================================================
      # 5) Validate required secrets
      # ============================================================
      - name: Validate secrets
        shell: bash
        run: |
          set -e

          echo "Checking required secrets..."

          test -n "$ELEVENLABS_API_KEY" || {
            echo "ERROR: ELEVENLABS_API_KEY is missing."
            exit 1
          }

          test -n "$PIXABAY_API_KEY" || {
            echo "ERROR: PIXABAY_API_KEY is missing."
            exit 1
          }

          test -n "$PEXELS_API_KEY" || {
            echo "ERROR: PEXELS_API_KEY is missing."
            exit 1
          }

          test -n "$YOUTUBE_TOKEN_JSON" || {
            echo "ERROR: YOUTUBE_TOKEN_JSON is missing."
            exit 1
          }

          echo "All required secrets are present."

      # ============================================================
      # 6) Create YouTube token.json
      # ============================================================
      - name: Create YouTube token.json
        shell: bash
        run: |
          set -e

          printf '%s' "$YOUTUBE_TOKEN_JSON" > token.json

          test -s token.json

          echo "YouTube token.json created successfully."

      # ============================================================
      # 7) Run video pipeline
      # ============================================================
      - name: Run pipeline
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "RUNNING RELIGIOUS VIDEO PIPELINE"
          echo "========================================"

          python religious_quotes.py

      # ============================================================
      # 8) Save used-script state to GitHub
      # ============================================================
      - name: Save used-script state
        shell: bash
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/used_voiceover_scripts.txt

          if git diff --cached --quiet; then
            echo "No state change to commit."
            exit 0
          fi

          git commit -m "chore: update used voiceover state"
          git push

      # ============================================================
      # 9) Cleanup sensitive token
      # ============================================================
      - name: Cleanup token
        if: always()
        shell: bash
        run: |
          rm -f token.json
